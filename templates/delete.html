{% extends '_base.html' %}

{% block content %}
    <h1>Delete Post</h1>
    <p>Are you sure you want to delete "{{ post.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'post-detail' post.pk %}"><button type="button">Cancel</button></a>
    </form>
{% endblock content %}
