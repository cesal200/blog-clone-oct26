<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
</head>
<body>
     <h1>Blog</h1>
    <ul>
     {% for publication in post_list %}
       <li> 
          <h2>{{ publication.title }}</h2>
             <p>{{ publication.author.username|default:"Anónimo" }}</p>
          <p>{{ publication.content }}</p>
          <p>publicado el {{ publication.created_at }}</p>
       </li>
     {% empty %}
         <li>No hay publicaciones todavía.</li>
    {% endfor %} 
    </ul>
</body>
</html>
