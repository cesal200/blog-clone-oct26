{% extends '_base.html' %}

{% block content %}
    <ul>
     {% for publication in post_list %}
       <li> 
             <a href="{% url 'post-detail' publication.pk %}"><h2>{{ publication.title }}</h2></a>   
             <p>{{ publication.author.username}}</p>
       </li>
    {% endfor %} 
    </ul>
{% endblock content %}
